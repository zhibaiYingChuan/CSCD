# C-S-C-D 程序级混合方案配置
# 管理级联压缩比、递归轮次、触发阈值，便于实验调优（无需改代码）。

# 递归级联压缩比表：键=递归轮次(从1开始)，值=该轮 COMBINE 压缩比
# 越深层对上层摘要依赖越强，压缩比递减（保留更少、更精炼）
compress_ratios:
  round_1: 0.6
  round_2: 0.5
  round_3: 0.4
  round_default: 0.4   # 超过已配置轮次时使用的默认比

# 每阶段内嵌压缩比（协议层提示用，仅作建议，非运行时强制）
stage_ratios:
  DECOMPOSE: 0.6
  CLASSIFY: 0.5
  SELECT: 0.7
  COMBINE: 0.4

# 主循环控制
max_rounds: 3            # 递归轮次硬上限（防无限递归，永远不低于下方动态值）

# 阶段C：按任务复杂度动态调节递归轮次（优化净成本）
# simple 任务不递归（max_rounds=1，净省 Token）；complex 才多轮深挖。
# 最终轮次 = min(rounds_by_complexity[复杂度], max_rounds)
rounds_by_complexity:
  simple: 1
  medium: 2
  complex: 3

budget_per_round: 4096   # 每轮模型调用 max_tokens；代码工程任务需保留交付物空间
temperature: 0.3

# 早停：连续两轮 COMBINE 摘要一致时终止
early_stop_on_stable: true

# 输出模式（真实端点验证发现，2026-09-02）：
#   false = 四阶协议模式：模型按 PERSONA 输出 <DECOMPOSE>/<CLASSIFY>/<SELECT>/<COMBINE>。
#           CSCD 主业（精准度+可追溯性）依赖此模式，单原子缓存也依赖其 DECOMPOSE 原子。
#   true  = 动作执行模式：模型输出 JSON 动作计划，由 Harness 落地到文件系统，
#           用于代码工程闭环（execute_action_loop 等），不适用于纯推理任务。
# 必须显式配置，不能依赖代码默认值：MCP 推理网关 cscd_reason 若走动作模式，
# 则「完整四阶递归推理」名不副实，且 marks_valid 会是恒 true 的伪造审计值。
prefer_action_plan: false

# 方向Y：simple 任务短路走基线直答（净成本=基线，不产生协议骨架开销）
# 仅对 simple 且无非可信输入的任务生效；medium/complex 仍走协议+缓存
simple_shortcut_to_baseline: true

# tiktoken 计量（None 时降级字符/1.6 近似）
tokenizer: "cl100k_base"

# ===== 推理时认知控制层（J-Space/dsh 补全，2026-08-18）=====
# 编排层(CSCD 四阶)之外的推理时认知控制：约束模型"能激活什么/如何记录推理状态/如何响应置信度"。
cognitive_control: true          # 总开关：注入工作空间/稠密轨/桥接/元认知指令
trajectory_anchoring: true       # dsh 首轮轨迹锚定：首轮只暴露极简工具白名单，晋升后解锁完整工具
runtime_ledger: true             # P4 运行时状态外化账本：把每轮认知状态/轨迹/交付物落盘到 .cscd/ledger/，支持 resume
runtime_workspace: true          # 推理时工作空间：goal/verified/open/next + traces/artifacts
marks_blocking: false            # XML 标记仅作兼容观测，不阻断状态更新与交付物提取

# ===== RoutingGen 风格动态路由（阶段 1.2）=====
routing:
  thresholds:
    fast: 3
    deep: 7

# ===== 方向二：推理控制机制（2026-08-20）=====
# 机制1：动态锚定 —— 首轮只暴露 read/search，模型实际执行后晋升
dynamic_anchoring: true
# 机制2：工作空间限制 —— focus 限制模型当前可处理的信息范围
workspace_focus_limit: true
# 机制3：桥接推理 —— 在 implement 阶段强制 UNDERSTAND 步骤
bridge_reasoning: true
